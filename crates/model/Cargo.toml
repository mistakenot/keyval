[package]
name = "model"
version = "0.1.0"
description = "keyval reference model: an independent, obviously correct model of the API semantics, written from PLAN.md §6 and §8 (test oracle, PLAN.md §10.14, T-7, T-12)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No production crate, by design: an oracle depends on none (T-12). The model itself needs
# only the standard library; the model server parses and writes the contract's strict JSON
# with serde (owner decision on br-w30-1-model-server-impl-eop).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
