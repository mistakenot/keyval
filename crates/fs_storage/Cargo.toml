[package]
name = "fs_storage"
version = "0.1.0"
description = "keyval's real-file byte-storage adapter: journal.log, the LOCK file and directory sync (adapter, PLAN.md §7.2, §7.6, §7.7)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
types = { workspace = true }

[features]
# Test-only (PLAN.md §10.17, T-2, T-6): stops the process at chosen durability calls so a
# probe can SIGKILL it there. Off by default; no production crate enables it, and
# tests/failpoints_absent.rs proves a release build has neither the feature nor the code.
failpoints = []

[dev-dependencies]
# The crash probes need the feature on in their own build: a crate may depend on itself.
fs_storage = { workspace = true, features = ["failpoints"] }
journal = { workspace = true }

[lints]
workspace = true
