# keyval workspace — virtual manifest (PLAN.md Appendix A).
#
# Shared surface (§11.7): edit only under a short, explicit Agent Mail reservation.
# Crates are created by the first bead that needs them (P6: no empty crates).
# Every direct dependency is declared once under [workspace.dependencies] and listed
# in DEPENDENCIES.md in the same commit (CD-12).
[workspace]
resolver = "3"
members = [
    "crates/checker",
    "crates/cli",
    "crates/fs_storage",
    "crates/journal",
    "crates/model",
    "crates/node",
    "crates/raft_adapter",
    "crates/server",
    "crates/sim",
    "crates/statemachine",
    "crates/types",
    "xtask",
    "xtask/probes/deterministic",
    "xtask/probes/production",
]
# Never members:
# - `vendor`: the vendored Raft library (W02) is a path dependency. Without this, Cargo
#   would make every path dependency inside the workspace directory a member.
# - `.local`: the commit candidate and accept trees there are whole checkouts of their own.
#   Cargo's workspace search for their vendored Raft library walks past their own root,
#   which excludes it, and would otherwise stop here.
exclude = [".local", "vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# First-party crates.
types = { path = "crates/types" }
journal = { path = "crates/journal" }
fs_storage = { path = "crates/fs_storage" }
statemachine = { path = "crates/statemachine" }
model = { path = "crates/model" }
raft_adapter = { path = "crates/raft_adapter" }
node = { path = "crates/node" }
# Third-party crates (each one ledgered in DEPENDENCIES.md).
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
jsonschema = { version = "0.58.5", default-features = false }
# The generated eraftpb code needs exactly its generator's runtime (VENDOR.toml [codegen]).
protobuf = "=2.28.0"
# The vendored, entropy-patched raft-rs 0.7.0 (vendor/raft/VENDOR.toml), with the only
# features keyval builds; engine crates only (DEP-RULE).
raft = { path = "vendor/raft/raft", default-features = false, features = ["protobuf-codec"] }
saphyr = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
slog = "2"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

# Lint policy (§5.2; AGENTS.md "Lint Policy"). The probe files of W01.3 prove that each
# denied lint actually fires on this toolchain. Never `allow` a lint that enforces a CD
# principle; any other allow is narrow and documented with the bead that decided it.
[workspace.lints.rust]
unsafe_code = "forbid" # CD-8
# The lint probes (xtask/probes) compile their deliberate violations only under
# `--cfg keyval_probe="<name>"`; declare the cfg so normal builds stay warning-free.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyval_probe, values(any()))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# CD-8: expected failures are values; broken invariants use CD-7 assertions, written with
# `types::invariant!` (built on `assert!`), the only sanctioned panic. clippy.toml permits
# unwrap/expect/panic inside tests. These stay `deny` rather than `forbid` only because
# proc-macro derives (clap) emit `#[allow(clippy::restriction)]`; LINT-ALLOWS rejects any
# first-party `allow` of a CD lint, and deterministic crates `forbid` them outright.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
