# The verification registry's requirements (PLAN.md §6, §10.13): one row per §6
# requirement, in plan order. IDs and levels must equal §6 (the plan wins, §0.4).
#
# `status` is derived, never typed by hand (§11.5 rule 12): a requirement is `active`
# once every work item listing it in registry/workgraph.toml `reqs` has closed, else
# `planned`. A requirement no work item lists stays `planned`. W05.1 seeded the
# statuses from the committed tracker export; `./dev commit --close` flips them since.
# `notes` records owner dispositions for qualified and SHOULD requirements (§15, §13).

schema = "keyval.registry.requirements/v1"

# §6.2 Data model

[[requirement]]
id = "DM-1"
level = "MUST"
status = "active"
title = "Keys are UTF-8 strings of 1-256 decoded bytes, stored exactly"
notes = "Size limits accepted by the owner 2026-10-01 (§15 Q1)."

[[requirement]]
id = "DM-2"
level = "MUST"
status = "active"
title = "Values are UTF-8 strings of 0-65,536 decoded bytes"
notes = "Size limits accepted by the owner 2026-10-01 (§15 Q1)."

[[requirement]]
id = "DM-3"
level = "MUST"
status = "planned"
title = "A key's version is the log index of the write that set it"

[[requirement]]
id = "DM-4"
level = "MUST"
status = "active"
title = "Keys are ordered byte-wise by their UTF-8 encoding"

[[requirement]]
id = "DM-5"
level = "MUST"
status = "active"
title = "The request history is never expired or evicted"

[[requirement]]
id = "DM-6"
level = "MUST"
status = "active"
title = "Bounded live state with a terminal capacity_exceeded result"
notes = "Owner disposition: live-state capacity accepted as stated 2026-10-01 (§15 Q2)."

[[requirement]]
id = "DM-7"
level = "MUST"
status = "active"
title = "History capacity admission limits and a local journal hard stop"
notes = "Owner disposition: history capacity and journal hard stop accepted as stated 2026-10-01 (§15 Q3); journal exhaustion is an accepted v1 failure mode (D-61)."

# §6.3 Operations

[[requirement]]
id = "F-1"
level = "MUST"
status = "planned"
title = "PUT sets a key and returns its new version and execution index"

[[requirement]]
id = "F-2"
level = "MUST"
status = "planned"
title = "GET returns value and version, or not_found, with served_by"

[[requirement]]
id = "F-3"
level = "MUST"
status = "planned"
title = "DELETE removes a key and reports whether it existed"

[[requirement]]
id = "F-4"
level = "MUST"
status = "planned"
title = "SCAN returns bounded, continuable pages of a key range"

[[requirement]]
id = "F-5"
level = "MUST"
status = "planned"
title = "COMPARE_SWAP against absent or a version; a mismatch is terminal"

[[requirement]]
id = "F-6"
level = "MUST"
status = "planned"
title = "Writes carry idempotency keys: replay, conflict, no retention window"

[[requirement]]
id = "F-7"
level = "MUST"
status = "planned"
title = "Any node accepts any request, with a fixed write decision order"

[[requirement]]
id = "F-8"
level = "MUST"
status = "planned"
title = "Invalid input is rejected before proposal, with no side effect"

[[requirement]]
id = "F-9"
level = "MUST"
status = "planned"
title = "Request status lookup never proposes; unknown does not mean not done"

[[requirement]]
id = "F-10"
level = "MUST"
status = "planned"
title = "Every outcome is distinguishable, terminal from non-terminal"

# §6.4 Consistency

[[requirement]]
id = "C-1"
level = "MUST"
status = "planned"
title = "Writes are linearizable in first-execution log order"

[[requirement]]
id = "C-2"
level = "MUST"
status = "planned"
title = "An acknowledged write is never lost"

[[requirement]]
id = "C-3"
level = "MUST"
status = "planned"
title = "A read reflects exactly an applied committed prefix"

[[requirement]]
id = "C-4"
level = "MUST"
status = "planned"
title = "One node's reads never go backwards within an incarnation"

[[requirement]]
id = "C-5"
level = "MUST"
status = "planned"
title = "COMPARE_SWAP is evaluated when its entry is applied"

[[requirement]]
id = "C-6"
level = "MUST"
status = "planned"
title = "Each request ID takes effect at most once"

[[requirement]]
id = "C-7"
level = "SHOULD"
status = "planned"
title = "Reads have no staleness bound in v1 (documented behaviour)"
notes = "SHOULD: keeps its level and needs a recorded disposition before release (§13)."

[[requirement]]
id = "C-8"
level = "MUST"
status = "planned"
title = "Each SCAN page comes from one applied prefix"

# §6.5 Availability & fault tolerance

[[requirement]]
id = "A-1"
level = "MUST"
status = "planned"
title = "Valid writes within capacity eventually succeed in the healthy envelope"
notes = "Owner disposition: availability relative to the healthy envelope (§9.4), accepted as stated 2026-10-01 (§15 Q4)."

[[requirement]]
id = "A-2"
level = "MUST"
status = "planned"
title = "Reads succeed on any ready node"
notes = "Owner disposition: availability relative to the healthy envelope (§9.4), accepted as stated 2026-10-01 (§15 Q4)."

[[requirement]]
id = "A-3"
level = "MUST"
status = "planned"
title = "A majority elects a new leader without operator action"

[[requirement]]
id = "A-4"
level = "MUST"
status = "planned"
title = "Recoverable nodes converge after faults heal, within the heal budget"
notes = "Owner disposition: availability relative to the healthy envelope (§9.4), accepted as stated 2026-10-01 (§15 Q4)."

[[requirement]]
id = "A-5"
level = "MUST"
status = "planned"
title = "An unconfirmed submitted write returns unknown_outcome"

