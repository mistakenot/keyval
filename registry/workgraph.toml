# Work graph — the machine mirror of PLAN.md §12.2 (§10.13, §11.11; W06).
#
# Shared surface (§11.7): edit only under a short, explicit Agent Mail reservation.
# PLAN.md wins (§0.4). Changes flow plan → this file → beads, never the other way: never
# edit a row to match the tracker. One [[item]] per §12.2 row, in plan order:
#
# - id, title: the §12.2 ID and Title cells, verbatim.
# - deps: the "Depends on" cell ("—" is []); identical to the §12.3 edges into the item.
# - reqs: the Reqs cell, one entry per comma-separated token, verbatim, with ranges such
#   as "F-1…F-10" expanded in place. Only §6 requirement IDs activate requirements;
#   principles, goals and section references are context (§10.13).
# - area: the Area cell, one entry per token, verbatim. A parenthesised suffix is the
#   plan's qualifier; the area name (Appendix A) is the text before it.
# - milestone: the item bead's m0–m5 label (§12.2 has no milestone column).
# - accept: the executable acceptance selectors `./dev accept` runs, each one `./dev`
#   command line (arguments separated by spaces, no shell quoting). The bead that
#   implements a selector registers it (§12.2), so an item lists only the selectors
#   registered so far. An empty list selects nothing, and acceptance must fail on it (P10).
# - bead: the tracker's bead ID, recorded by `./dev beads import`. It is never guessed or
#   typed by hand, and is "" until the import records it.
#
# The registry gate (condition 8) fails when id, deps, reqs or area differ from §12.2, on a
# cycle, or when the edges between plan:W<nn> beads differ from deps. milestone, accept
# and bead are registry-owned detail.

