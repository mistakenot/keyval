# The verification registry's checks (PLAN.md §10.13): one row per registered check.
# Until W05.2 makes this file the catalogue's source, it mirrors the bootstrap
# catalogue in xtask/src/check.rs exactly; a test fails on any difference, so a new
# check lands with its row here in the same commit (§11.5 rule 12).
#
# `status` is declared and forward-only (planned -> implemented, D-56): moving a check
# back needs an owner-approved plan-change. `run` is the exact ./dev check selector,
# `min_cases` is never zero, and `catches` is only for bug variants (§10.6).

schema = "keyval.registry.checks/v1"

[[check]]
id = "XTASK"
summary = "the whole xtask test suite (the bootstrap gate's xtask tests, §10.10)"
kind = "test_group"
covers = ["P7", "P10", "O-6"]
api = []
class = "invariant"
tier = "T0"
run = "./dev check XTASK"
min_cases = 40
status = "implemented"

