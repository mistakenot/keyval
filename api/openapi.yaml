openapi: 3.1.0
info:
  title: keyval HTTP API
  version: 1.0.0
  summary: Strongly consistent key-value store — public client API, v1.
  description: |
    The precise HTTP contract for keyval's public client API. It MUST match PLAN.md §8;
    on any conflict, PLAN.md wins (§0.4).

    ## Conventions (PLAN.md §8.1)

    - **Base path** `/v1`. Request and response bodies are JSON, encoded as UTF-8.
      A request with a body MUST send `Content-Type: application/json`.
    - **Strict JSON.** Unknown fields, duplicate member names, malformed UTF-8 and
      malformed numbers are rejected with `400 invalid_request`. Every request-body
      schema is closed (`additionalProperties: false`); the other three rules cannot
      be expressed in JSON Schema and are stated here.
    - **Keys are query parameters, never path segments.** A key may contain `/`, `?`
      and `&`, so it travels in the query string, percent-encoded.
    - **Query decoding.** `key`, `start`, `end` and `after` are percent-decoded per
      RFC 3986. An **unescaped `+`** anywhere in a query value is rejected with
      `400 invalid_request`: form-encoding libraries send a space as `+`, so treating
      `+` as either a plus or a space would silently corrupt keys. Send a literal plus
      as `%2B` and a space as `%20`. An invalid percent escape, invalid UTF-8 after
      decoding, or a repeated parameter is also `400 invalid_request`. A `307`
      `Location` re-encodes exactly the same decoded bytes.
    - **No caching.** Every response, including reads, status lookups and health,
      carries `Cache-Control: no-store`, so no intermediary can serve a stale
      `served_by`, lifecycle or result.
    - **Byte limits** (DM-1, DM-2) apply to the decoded UTF-8 bytes. JSON Schema's
      `minLength`/`maxLength` count characters, not bytes, so each byte limit is
      recorded in an `x-maxUtf8Bytes` extension on the schema it bounds. Where a
      schema also carries `maxLength`, it is only a necessary condition (one character
      is at least one byte); `x-maxUtf8Bytes` is the limit. A SCAN page's cap on the
      sum of its items' decoded key and value bytes is `x-maxPageUtf8Bytes` on
      `ScanPage` (F-4, §7.11).
    - **Writes** (PUT, DELETE, compare-and-swap) MUST carry an `Idempotency-Key` header
      of exactly 32 lowercase hexadecimal characters (128 bits) (F-6). Its value is the
      request ID.
    - **Integers** (versions, indices, terms, node IDs) are plain JSON numbers, always
      below 2^53, so every JSON client handles them exactly. A request integer at or
      above 2^53 (for example a compare-and-swap `expected.version`) is
      `400 invalid_request`.
    - **Terminal results are immutable.** `request_id`, `index` and the decision never
      change across retries or status lookups; only `served_by` and `replayed` may.
    - **Request size.** A request body over 512 KiB (524,288 bytes) is `413 too_large`,
      recorded as `x-maxBodyBytes` on each request body. That is enough for the
      worst-case JSON escaping of a valid value (§7.11).

    ## Errors (PLAN.md §8.1, §8.4)

    Every error has the same envelope, `{"error": {"code", "message", "details"}}`.
    `code` is one of the twelve codes below; `message` is human-readable text with no
    contract; `details` is always present, possibly empty, and its schema is fixed by
    the code (and, for `busy`, `unavailable` and `recovering`, by whether the request
    was a write). Write errors use exactly three `details` shapes:

    1. **Terminal execution results** (`version_mismatch`, `capacity_exceeded`): always
       `request_id`, `index` (the first execution's log index), `replayed` and the
       decision, exactly as immutable as a success. Such an error is evidence that
       the request executed and committed (§8.3).
    2. **Conflict refusal** (`request_id_conflict`): `request_id` and `original_index`.
       It is terminal *for this ID*, but it is not an execution of this command.
    3. **Non-terminal refusals** (`not_leader`, `busy`, `unavailable`, `recovering`,
       `unknown_outcome`, `history_full`): `request_id` and `attempt_state`
       (`not_submitted` or `submitted`), plus code-specific fields. `attempt_state`
       describes **this attempt only** (A-5); terminality is a property of the
       decision, never of whether this attempt submitted a proposal.

    Validation errors (`400 invalid_request`, `413 too_large`) carry `request_id`
    only when a well-formed `Idempotency-Key` was present. A missing or malformed ID
    is the one case where it is omitted.

    | HTTP | `code` | Terminal? | When |
    |---|---|---|---|
    | 307 | `not_leader` | no (`not_submitted`) | A write reached a non-leader that believes it knows the leader. `Location` is the leader's URL for the same path and query. |
    | 400 | `invalid_request` | no | Malformed input, bad key (DM-1), bad request ID, bad range or pagination parameters. |
    | 404 | `not_found` | — | GET of an absent key. |
    | 409 | `version_mismatch` | **yes** | The compare-and-swap expectation did not match at application. Consumes the request ID. |
    | 409 | `request_id_conflict` | **yes**, for this ID | The ID was already used for a different command. Nothing changed. |
    | 413 | `too_large` | no | Value over 64 KiB (DM-2) or body over 512 KiB. |
    | 429 | `busy` | no (`not_submitted`) | A local admission bound was hit, or the consensus library synchronously rejected the proposal with nothing appended (§7.11). Reads can be `busy` too (A-2). |
    | 503 | `unavailable` | no (`not_submitted`) | No leader known, or the node is shutting down. |
    | 503 | `recovering` | no | The node is not ready (starting, recovering or failed). |
    | 504 | `unknown_outcome` | **unresolved** | Submitted, but commit was not observed before the deadline, leadership was lost, or the entry was superseded or truncated after submission. |
    | 507 | `capacity_exceeded` | **yes**, a committed decision | The live-state quota (DM-6) refused the executed write. |
    | 507 | `history_full` | no (`not_submitted`) | The history capacity (DM-7) refused admission before proposal. |

    `capacity_exceeded` and `history_full` are two distinct codes by design: one is a
    committed decision, the other a refusal before proposal (D-54).

    Unsupported methods and media types may be answered `405` or `415`, still with
    the error envelope (code `invalid_request`) where the server controls the response.

    ## Client guidance (PLAN.md §8.4; the CLI implements it)

    - `307`: follow `Location` with the same request ID and body.
    - `503 unavailable`, `429 busy`, `503 recovering`: back off and retry the same
      request, possibly at another node.
    - `504 unknown_outcome`, or a dropped connection after sending: retry with the
      **same** request ID and command, or query `GET /v1/requests/{id}`. A status of
      `unknown` is not a failure.
    - `507 history_full`: the log is at capacity; retrying helps only after the limit
      is raised (v2 compaction). Reads, status lookups and retries of already-executed
      requests still work.
    - `version_mismatch`: to try again against newer state, read the new version and
      send a **new** request ID.
    - An error on a later attempt is never evidence that an earlier attempt did not
      commit.

    The peer channel (`POST /raft` on each node's peer address) is internal to the
    cluster and is not part of this contract.
servers:
  - url: http://{address}
    description: >-
      One keyval node's client address. Every node accepts every request (F-7). The
      local cluster's addresses come from `config/local.toml`; addresses default to
      loopback, and the API is unauthenticated (O-9).
    variables:
      address:
        default: 127.0.0.1:7001
        description: The node's configured `client_address` (host:port).
tags:
  - name: kv
    description: Reads and writes of keys.
  - name: requests
    description: Status of earlier write requests.
  - name: health
    description: Process liveness and read readiness.
  - name: cluster
    description: This node's view of the Raft group.
paths:
  /v1/kv:
    parameters:
      - $ref: '#/components/parameters/Key'
    get:
      operationId: getKey
      tags: [kv]
      summary: Read one key.
      description: |
        Returns the key's value and version from this node's current published view,
        with no leader round-trip and no quorum (§7.9). The read reflects exactly the
        committed prefix `[1..served_by.applied_index]`, which this node had applied
        when it answered (C-3). Reads may be stale (C-7); `served_by` makes the
        staleness visible.
      x-requirements: [F-2]
      responses:
        '200':
          description: The key is present.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResult'
        '400':
          $ref: '#/components/responses/InvalidReadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/ReadBusy'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    put:
      operationId: putKey
      tags: [kv]
      summary: Set a key's value.
      description: |
        Sets the key to the value. A successful PUT executed at log index *i* gives
        the key version *i*, so `version == index` (DM-3); a same-value PUT still gets
        a new version. A repeated `Idempotency-Key` with the same command returns the
        original terminal result without re-executing (`replayed: true`) (F-6).
      x-requirements: [F-1, F-6]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-maxBodyBytes: 524288
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRequest'
            examples:
              greeting:
                summary: PLAN.md §8.6
                value:
                  value: hello
      responses:
        '200':
          description: The write executed, or this is a replay of its first execution.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionedWriteResult'
              examples:
                greeting:
                  summary: >-
                    PLAN.md §8.6: `PUT /v1/kv?key=greeting` with
                    `Idempotency-Key: d70ff69df7084a088e4a531837cc4e5a`.
                  value:
                    request_id: d70ff69df7084a088e4a531837cc4e5a
                    index: 42
                    version: 42
                    replayed: false
                    served_by:
                      node_id: 2
                      applied_index: 42
        '307':
          $ref: '#/components/responses/NotLeader'
        '400':
          $ref: '#/components/responses/InvalidWriteRequest'
        '409':
          $ref: '#/components/responses/RequestIdConflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/WriteBusy'
        '503':
          $ref: '#/components/responses/WriteUnavailable'
        '504':
          $ref: '#/components/responses/UnknownOutcome'
        '507':
          $ref: '#/components/responses/SetCapacity'
    delete:
      operationId: deleteKey
      tags: [kv]
      summary: Delete a key.
      description: |
        Removes the key and reports whether it existed. Deleting an absent key
        succeeds with `existed: false` (F-3). DELETE assigns no version (DM-3). A
        repeated `Idempotency-Key` with the same command returns the original terminal
        result without re-executing (`replayed: true`) (F-6).
      x-requirements: [F-3, F-6]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The delete executed, or this is a replay of its first execution.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '307':
          $ref: '#/components/responses/NotLeader'
        '400':
          $ref: '#/components/responses/InvalidWriteRequest'
        '409':
          $ref: '#/components/responses/RequestIdConflict'
        '429':
          $ref: '#/components/responses/WriteBusy'
        '503':
          $ref: '#/components/responses/WriteUnavailable'
        '504':
          $ref: '#/components/responses/UnknownOutcome'
        '507':
          $ref: '#/components/responses/HistoryFull'
  /v1/cas:
    post:
      operationId: compareAndSwap
      tags: [kv]
      summary: Set a key only if its current state matches an expectation.
      description: |
        Sets the key only if, when the entry is applied (never at admission, C-5), the
        key is absent (`expected.kind: absent`) or has exactly the expected version
        (`expected.kind: version`). On success `version == index` (DM-3). A mismatch
        changes nothing and is a committed, terminal result that consumes the request
        ID; comparing again against newer state needs a new request ID (F-5). A
        repeated `Idempotency-Key` with the same command returns the original terminal
        result without re-executing (`replayed: true`) (F-6).
      x-requirements: [F-5, F-6]
      parameters:
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-maxBodyBytes: 524288
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasRequest'
            examples:
              counter:
                summary: PLAN.md §8.6
                value:
                  expected:
                    kind: version
                    version: 41
                  value: '12'
              create-only:
                summary: Set the key only if it is absent.
                value:
                  expected:
                    kind: absent
                  value: first
      responses:
        '200':
          description: >-
            The expectation matched and the write executed, or this is a replay of its
            first execution.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionedWriteResult'
        '307':
          $ref: '#/components/responses/NotLeader'
        '400':
          $ref: '#/components/responses/InvalidWriteRequest'
        '409':
          description: >-
            `version_mismatch`: the expectation did not match when the entry was applied
            (terminal; consumes the request ID). `request_id_conflict`: the ID was
            already used for a different command (nothing changed).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VersionMismatchError'
                  - $ref: '#/components/schemas/RequestIdConflictError'
              examples:
                version-mismatch:
                  summary: >-
                    PLAN.md §8.6: `POST /v1/cas?key=counter` with
                    `Idempotency-Key: 7f3c0b8e2a6d4f19b1c5e0a9d8f7c6b5`.
                  value:
                    error:
                      code: version_mismatch
                      message: expected 41, current 57
                      details:
                        current_version: 57
                        request_id: 7f3c0b8e2a6d4f19b1c5e0a9d8f7c6b5
                        index: 58
                        replayed: false
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/WriteBusy'
        '503':
          $ref: '#/components/responses/WriteUnavailable'
        '504':
          $ref: '#/components/responses/UnknownOutcome'
        '507':
          $ref: '#/components/responses/SetCapacity'
  /v1/scan:
    get:
      operationId: scanKeys
      tags: [kv]
      summary: Read one page of keys in a range.
      description: |
        Returns keys in `[start, end)`, in ascending byte-wise order of their UTF-8
        encoding (DM-4), with their values and versions (F-4, §8.5).

        - Omitted bounds are unbounded. `start > end` is `400 invalid_request`; equal
          bounds give an empty page. An empty key is invalid even as a bound: omit the
          parameter instead.
        - `after` is an exclusive lower continuation bound, intersected with the
          range. `after ≥ end` gives an empty page.
        - A page holds at most `limit` items and at most 1 MiB (1,048,576 bytes) of
          decoded key+value bytes. Items are taken in order, summing
          `len(key) + len(value)` in decoded bytes; the page stops before the item
          that would exceed either cap, and the first item is always returned, so one
          maximum-size item always fits (§7.11).
        - Each page is copied from **one** applied prefix, the one reported in
          `served_by` (C-8). `has_more` is true when another key in range existed
          beyond the returned items in that view; then `next_after` is exactly the
          last returned key, otherwise it is null.
        - To continue, repeat the same range with `after=next_after`. Pages may come
          from different prefixes or nodes, so keys inserted or deleted between pages
          may be missed or appear, but a normally continued traversal never returns the
          same key twice. There is no server-side cursor and no multi-page snapshot.
      x-requirements: [F-4]
      parameters:
        - $ref: '#/components/parameters/ScanStart'
        - $ref: '#/components/parameters/ScanEnd'
        - $ref: '#/components/parameters/ScanAfter'
        - $ref: '#/components/parameters/ScanLimit'
      responses:
        '200':
          description: One page of the range.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanPage'
        '400':
          $ref: '#/components/responses/InvalidReadRequest'
        '429':
          $ref: '#/components/responses/ReadBusy'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
  /v1/requests/{request_id}:
    get:
      operationId: getRequestStatus
      tags: [requests]
      summary: Look up the terminal result of an earlier write.
      description: |
        Returns the original terminal result if this node has applied the request, or
        `unknown` otherwise (F-9). It never proposes anything. `unknown` never means
        "did not happen": the request may still be in flight, or committed but not yet
        applied here. The lookup is `200` whatever the stored decision was; the
        embedded result says what happened (§8.3).
      x-requirements: [F-9]
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: The request's state as known to this node.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '400':
          $ref: '#/components/responses/InvalidReadRequest'
        '429':
          $ref: '#/components/responses/ReadBusy'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
  /v1/health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Report that the process can answer, and its lifecycle state.
      description: |
        Answers whenever the process can answer at all, in every lifecycle state
        (O-1). Recovery is visible here as `recovering` (§7.7).
      x-requirements: [O-1]
      responses:
        '200':
          description: The process is answering.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveHealth'
  /v1/health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Report whether a complete committed read view is available.
      description: |
        Returns `200` only when this node is `ready`, that is, a complete committed
        read view is available and reads are served (O-1, §7.7 step 7).
      x-requirements: [O-1]
      responses:
        '200':
          description: The node is ready.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealth'
        '503':
          description: The node is not ready (`recovering`).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveringReadError'
  /v1/cluster:
    get:
      operationId: getClusterStatus
      tags: [cluster]
      summary: Report this node's view of the Raft group.
      description: |
        Reports this node's identity, Raft role and term, the leader it believes in
        (if any), its durable last, commit and applied indices, and the configured
        voters with replication progress where this node knows it (O-1). Every value
        is this node's local view at the moment it answered.
      x-requirements: [O-1]
      responses:
        '200':
          description: This node's view of the group.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
components:
  parameters:
    Key:
      name: key
      in: query
      required: true
      description: >-
        The key, percent-encoded per RFC 3986 (an unescaped `+` is rejected; see the
        query-decoding convention). Its limits apply after decoding (DM-1).
      schema:
        $ref: '#/components/schemas/Key'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        The request ID: 32 lowercase hexadecimal characters (F-6). Every attempt of
        one logical write, including retries and redirects, carries the same ID.
      schema:
        $ref: '#/components/schemas/RequestId'
    RequestIdPath:
      name: request_id
      in: path
      required: true
      description: The request ID of the write to look up.
      schema:
        $ref: '#/components/schemas/RequestId'
    ScanStart:
      name: start
      in: query
      required: false
      description: >-
        Inclusive lower bound of the range, percent-encoded like `key`. Omit for an
        unbounded start.
      schema:
        $ref: '#/components/schemas/Key'
    ScanEnd:
      name: end
      in: query
      required: false
      description: >-
        Exclusive upper bound of the range, percent-encoded like `key`. Omit for an
        unbounded end.
      schema:
        $ref: '#/components/schemas/Key'
    ScanAfter:
      name: after
      in: query
      required: false
      description: >-
        Exclusive continuation bound, percent-encoded like `key`: pass the previous
        page's `next_after`.
      schema:
        $ref: '#/components/schemas/Key'
    ScanLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 128
        default: 32
  responses:
    NotLeader:
      description: >-
        `not_leader`: this node is not the leader but believes it knows one. Follow
        `Location` with the same request ID and body. Nothing was submitted by this
        attempt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Location:
          $ref: '#/components/headers/LeaderLocation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotLeaderError'
    InvalidWriteRequest:
      description: >-
        `invalid_request`: malformed input, a bad key or a bad request ID. Rejected
        before proposal, with no side effect (F-8).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidWriteRequestError'
    InvalidReadRequest:
      description: >-
        `invalid_request`: malformed input, a bad key or request ID, or bad range or
        pagination parameters.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidReadRequestError'
    NotFound:
      description: '`not_found`: the key is absent in the applied prefix in `served_by`.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    RequestIdConflict:
      description: >-
        `request_id_conflict`: the ID was already used for a different command.
        Nothing changed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestIdConflictError'
    TooLarge:
      description: >-
        `too_large`: the value is over 64 KiB (DM-2) or the body is over 512 KiB.
        Rejected before proposal, with no side effect (F-8).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooLargeError'
    WriteBusy:
      description: >-
        `busy`: a local admission bound was hit, or the consensus library
        synchronously rejected the proposal with nothing appended. Not submitted;
        back off and retry the same request.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusyWriteError'
    ReadBusy:
      description: '`busy`: a local admission bound was hit (A-2). Back off and retry.'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusyReadError'
    WriteUnavailable:
      description: >-
        `unavailable`: no leader is known, or the node is shutting down.
        `recovering`: the node is not ready. Neither submitted anything; back off and
        retry the same request, possibly at another node.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/UnavailableWriteError'
              - $ref: '#/components/schemas/RecoveringWriteError'
    ReadUnavailable:
      description: >-
        `unavailable`: the node is shutting down. `recovering`: the node is not ready,
        so it serves no reads (A-2). Back off and retry, possibly at another node.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/UnavailableReadError'
              - $ref: '#/components/schemas/RecoveringReadError'
    UnknownOutcome:
      description: >-
        `unknown_outcome`: this attempt was submitted, but its commit was not observed
        before the deadline, leadership was lost, or the entry was superseded or
        truncated after submission. Retry with the same request ID and command, or
        query `GET /v1/requests/{id}`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnknownOutcomeError'
          examples:
            deadline:
              summary: PLAN.md §8.6, for the PUT of `greeting`.
              value:
                error:
                  code: unknown_outcome
                  message: A committed result is not known locally.
                  details:
                    request_id: d70ff69df7084a088e4a531837cc4e5a
                    attempt_state: submitted
                    guidance: retry_same_request_or_query_status
                    nodes:
                      - http://127.0.0.1:7001
                      - http://127.0.0.1:7002
                      - http://127.0.0.1:7003
                      - http://127.0.0.1:7004
                      - http://127.0.0.1:7005
    SetCapacity:
      description: >-
        `capacity_exceeded`: the live-state quota (DM-6) refused the executed write, a
        committed terminal decision. `history_full`: the history capacity (DM-7)
        refused admission before proposal, which is not terminal.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CapacityExceededError'
              - $ref: '#/components/schemas/HistoryFullError'
    HistoryFull:
      description: >-
        `history_full`: the history capacity (DM-7) refused admission before proposal.
        A DELETE is never refused by the live-state quota (DM-6).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HistoryFullError'
  headers:
    LeaderLocation:
      description: >-
        The believed leader's client URL for the same path and query, re-encoding
        exactly the same decoded query bytes (§8.1).
      required: true
      schema:
        type: string
        format: uri
        pattern: '^http://[^/?#]+/v1/'
    CacheControl:
      description: >-
        Present on every response, with exactly this value, so that no intermediary
        caches a read, status, health or error response (§8.1).
      required: true
      schema:
        type: string
        const: no-store
  schemas:
    Key:
      description: |
        A key (DM-1): a UTF-8 string of 1–256 bytes, measured after decoding (not
        characters, not JSON-escaped length). Keys are stored exactly, with no case or
        Unicode normalisation, so composed and decomposed forms are different keys.
        Keys are ordered by the byte-wise lexicographic order of their UTF-8 encoding
        (DM-4).
      type: string
      minLength: 1
      maxLength: 256
      x-maxUtf8Bytes: 256
    Value:
      description: |
        A value (DM-2): a UTF-8 string of 0–65,536 bytes (64 KiB), measured after
        decoding.
      type: string
      maxLength: 65536
      x-maxUtf8Bytes: 65536
    RequestId:
      description: >-
        A request ID: exactly 32 lowercase hexadecimal characters (128 bits) (F-6).
        It identifies one logical write for the lifetime of the cluster; there is no
        retention window (DM-5).
      type: string
      pattern: '^[0-9a-f]{32}$'
    NodeId:
      description: A configured node ID, nonzero and below 2^53.
      type: integer
      minimum: 1
      maximum: 9007199254740991
    EntryIndex:
      description: >-
        The log index of an entry. Raft log indices start at 1. Below 2^53.
      type: integer
      minimum: 1
      maximum: 9007199254740991
    ProgressIndex:
      description: >-
        A log position reported as progress (applied, committed, durable or matched).
        It is 0 before any entry has reached that state. Below 2^53.
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Version:
      description: >-
        A key version: the log index at which the PUT or compare-and-swap that set it
        executed (DM-3). Versions strictly increase per key, including across delete
        and re-create, and have gaps. Below 2^53.
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Term:
      description: A Raft term. Below 2^53.
      type: integer
      minimum: 0
      maximum: 9007199254740991
    NodeUrl:
      description: >-
        A node's client address as a base URL: scheme `http`, host and port, no path,
        for example `http://127.0.0.1:7001`.
      type: string
      format: uri
      pattern: '^http://[^/?#]+$'
    ServedBy:
      description: >-
        Which node answered, and the applied prefix `[1..applied_index]` its answer
        reflects (C-3). For a write result, `applied_index` is at least the write's
        `index`, because a node acknowledges a write only after applying it (DUR-1).
      type: object
      additionalProperties: false
      required: [node_id, applied_index]
      properties:
        node_id:
          $ref: '#/components/schemas/NodeId'
        applied_index:
          $ref: '#/components/schemas/ProgressIndex'
    PutRequest:
      description: The body of a PUT.
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/Value'
    CasRequest:
      description: The body of a compare-and-swap.
      type: object
      additionalProperties: false
      required: [expected, value]
      properties:
        expected:
          $ref: '#/components/schemas/CasExpectation'
        value:
          $ref: '#/components/schemas/Value'
    CasExpectation:
      description: >-
        What the key's state must be when the entry is applied: absent, or present
        with exactly this version (F-5).
      oneOf:
        - $ref: '#/components/schemas/ExpectAbsent'
        - $ref: '#/components/schemas/ExpectVersion'
      discriminator:
        propertyName: kind
        mapping:
          absent: '#/components/schemas/ExpectAbsent'
          version: '#/components/schemas/ExpectVersion'
    ExpectAbsent:
      description: The key must be absent.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: absent
    ExpectVersion:
      description: The key must be present with exactly this version.
      type: object
      additionalProperties: false
      required: [kind, version]
      properties:
        kind:
          const: version
        version:
          $ref: '#/components/schemas/Version'
    VersionedWriteResult:
      description: >-
        The result of a successful PUT or compare-and-swap. `index` is the log index
        of the request's first execution, and `version == index` (§8.3).
      type: object
      additionalProperties: false
      required: [request_id, index, version, replayed, served_by]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        index:
          $ref: '#/components/schemas/EntryIndex'
        version:
          $ref: '#/components/schemas/Version'
        replayed:
          description: >-
            True when this response returns a result recorded earlier (a retry or a
            duplicate entry); the decision is the original one (§8.3).
          type: boolean
        served_by:
          $ref: '#/components/schemas/ServedBy'
    DeleteResult:
      description: >-
        The result of a DELETE. `index` is the log index of the request's first
        execution; DELETE has no version (§8.3).
      type: object
      additionalProperties: false
      required: [request_id, index, existed, replayed, served_by]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        index:
          $ref: '#/components/schemas/EntryIndex'
        existed:
          description: Whether the key existed when the delete was applied (F-3).
          type: boolean
        replayed:
          description: >-
            True when this response returns a result recorded earlier (a retry or a
            duplicate entry); the decision is the original one (§8.3).
          type: boolean
        served_by:
          $ref: '#/components/schemas/ServedBy'
    ReadResult:
      description: A present key, as of the applied prefix in `served_by` (F-2).
      type: object
      additionalProperties: false
      required: [key, value, version, served_by]
      properties:
        key:
          $ref: '#/components/schemas/Key'
        value:
          $ref: '#/components/schemas/Value'
        version:
          $ref: '#/components/schemas/Version'
        served_by:
          $ref: '#/components/schemas/ServedBy'
    ScanItem:
      description: One key in a SCAN page.
      type: object
      additionalProperties: false
      required: [key, value, version]
      properties:
        key:
          $ref: '#/components/schemas/Key'
        value:
          $ref: '#/components/schemas/Value'
        version:
          $ref: '#/components/schemas/Version'
    ScanPage:
      description: >-
        One SCAN page, copied from the single applied prefix in `served_by` (C-8).
        Items are unique and in ascending key order. When `has_more` is true,
        `next_after` is exactly the last returned key; otherwise it is null.
      type: object
      x-maxPageUtf8Bytes: 1048576
      additionalProperties: false
      required: [items, has_more, next_after, served_by]
      properties:
        items:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ScanItem'
        has_more:
          type: boolean
        next_after:
          oneOf:
            - $ref: '#/components/schemas/Key'
            - type: 'null'
        served_by:
          $ref: '#/components/schemas/ServedBy'
      if:
        required: [has_more]
        properties:
          has_more:
            const: true
      then:
        properties:
          items:
            minItems: 1
          next_after:
            $ref: '#/components/schemas/Key'
      else:
        properties:
          next_after:
            type: 'null'
    TerminalResult:
      description: |
        A write's stored terminal result, exactly as the body a retry of the same
        request (same ID, same command) would receive from this node now: a success
        body, or the `version_mismatch` or `capacity_exceeded` error envelope (whose
        `code` implies the HTTP status of the original, 409 or 507). Its `request_id`,
        `index` and decision are the original's, `replayed` is `true`, and a success
        body's `served_by` equals the lookup's. `request_id_conflict` is never a stored
        result: it is not an execution of any command (§8.1).
      oneOf:
        - $ref: '#/components/schemas/VersionedWriteResult'
        - $ref: '#/components/schemas/DeleteResult'
        - $ref: '#/components/schemas/VersionMismatchError'
        - $ref: '#/components/schemas/CapacityExceededError'
    RequestStatus:
      description: The state of a request ID as known to the serving node (F-9).
      oneOf:
        - $ref: '#/components/schemas/KnownRequestStatus'
        - $ref: '#/components/schemas/UnknownRequestStatus'
      discriminator:
        propertyName: state
        mapping:
          known: '#/components/schemas/KnownRequestStatus'
          unknown: '#/components/schemas/UnknownRequestStatus'
    KnownRequestStatus:
      description: This node has applied the request; `result` is its terminal result.
      type: object
      additionalProperties: false
      required: [state, result, served_by]
      properties:
        state:
          const: known
        result:
          $ref: '#/components/schemas/TerminalResult'
        served_by:
          $ref: '#/components/schemas/ServedBy'
    UnknownRequestStatus:
      description: >-
        This node has not applied the request as of `served_by.applied_index`. This is
        not a failure: the request may be in flight, or committed but not yet applied
        here (F-9).
      type: object
      additionalProperties: false
      required: [state, served_by]
      properties:
        state:
          const: unknown
        served_by:
          $ref: '#/components/schemas/ServedBy'
    Lifecycle:
      description: >-
        A node's lifecycle state (O-1). Reads are served only when `ready`; a
        `failed` node has stopped appending (for example at the journal hard stop,
        DM-7) and is visible as such here.
      type: string
      enum: [starting, recovering, ready, failed]
    LiveHealth:
      description: The process is answering, in the given lifecycle state.
      type: object
      additionalProperties: false
      required: [status, node_id, lifecycle]
      properties:
        status:
          const: ok
        node_id:
          $ref: '#/components/schemas/NodeId'
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
    ReadyHealth:
      description: The node is ready; the body mirrors `LiveHealth` with `lifecycle` fixed.
      type: object
      additionalProperties: false
      required: [status, node_id, lifecycle]
      properties:
        status:
          const: ok
        node_id:
          $ref: '#/components/schemas/NodeId'
        lifecycle:
          const: ready
    Role:
      description: >-
        This node's Raft role. `pre_candidate` is the pre-vote phase of an election
        (pre-vote is on, §7.10).
      type: string
      enum: [leader, follower, candidate, pre_candidate]
    ClusterStatus:
      description: This node's local view of the Raft group (O-1).
      type: object
      additionalProperties: false
      required:
        - node_id
        - cluster_id
        - role
        - term
        - leader_id
        - durable_last_index
        - commit_index
        - applied_index
        - peers
      properties:
        node_id:
          $ref: '#/components/schemas/NodeId'
        cluster_id:
          description: The configured, human-readable cluster ID (for example `keyval-local-v1`).
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
        term:
          $ref: '#/components/schemas/Term'
        leader_id:
          description: The leader this node believes in, or null when none is known.
          oneOf:
            - $ref: '#/components/schemas/NodeId'
            - type: 'null'
        durable_last_index:
          description: The last log index this node has synced to its journal.
          $ref: '#/components/schemas/ProgressIndex'
        commit_index:
          description: The highest log index this node knows to be committed.
          $ref: '#/components/schemas/ProgressIndex'
        applied_index:
          description: The highest log index this node has applied and published.
          $ref: '#/components/schemas/ProgressIndex'
        peers:
          description: >-
            Every configured voter, this node included, in ascending `id` order.
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/Peer'
    Peer:
      description: >-
        One configured voter. `match_index` is present only where this node knows the
        voter's replication progress (as leader).
      type: object
      additionalProperties: false
      required: [id, client_address]
      properties:
        id:
          $ref: '#/components/schemas/NodeId'
        client_address:
          $ref: '#/components/schemas/NodeUrl'
        match_index:
          $ref: '#/components/schemas/ProgressIndex'
    ErrorCode:
      description: >-
        Every error code (§8.4). The domain error type's variants match this list
        exactly (§10.13 condition 5).
      type: string
      enum:
        - not_leader
        - invalid_request
        - not_found
        - version_mismatch
        - request_id_conflict
        - too_large
        - busy
        - unavailable
        - recovering
        - unknown_outcome
        - capacity_exceeded
        - history_full
    ErrorMessage:
      description: Human-readable text. Clients must not parse it; `code` and `details` carry the contract.
      type: string
    AttemptState:
      description: >-
        Whether **this attempt** submitted a proposal (A-5). `not_submitted` says
        nothing about earlier attempts with the same ID.
      type: string
      enum: [not_submitted, submitted]
    NotReadyLifecycle:
      description: A lifecycle state in which the node serves no reads and admits no writes.
      type: string
      enum: [starting, recovering, failed]
    NodeList:
      description: >-
        Every configured voter's client address, in ascending node-ID order (§8.4:
        "all configured client addresses").
      type: array
      minItems: 1
      maxItems: 5
      items:
        $ref: '#/components/schemas/NodeUrl'
    LiveStateLimit:
      description: >-
        Which live-state quota (DM-6) the executed write would have exceeded, named
        by its configuration parameter (§7.10).
      type: string
      enum: [max_live_keys, max_live_bytes]
    HistoryLimit:
      description: >-
        Which history capacity (DM-7) refused admission, named by its configuration
        parameter (§7.10).
      type: string
      enum: [max_log_entries, max_history_bytes]
    NotLeaderError:
      description: '`307 not_leader`: a non-terminal refusal; this attempt was not submitted.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: not_leader
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [leader_hint, request_id, attempt_state]
              properties:
                leader_hint:
                  description: The node ID of the leader this node believes in.
                  $ref: '#/components/schemas/NodeId'
                request_id:
                  $ref: '#/components/schemas/RequestId'
                attempt_state:
                  const: not_submitted
    InvalidWriteRequestError:
      description: >-
        `400 invalid_request` on a write. `request_id` is present exactly when a
        well-formed `Idempotency-Key` was sent.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: invalid_request
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
    InvalidReadRequestError:
      description: '`400 invalid_request` on a read or status lookup; it carries no write fields.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: invalid_request
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
    NotFoundError:
      description: '`404 not_found`: GET of a key absent in the applied prefix in `served_by`.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: not_found
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [served_by]
              properties:
                served_by:
                  $ref: '#/components/schemas/ServedBy'
    VersionMismatchError:
      description: >-
        `409 version_mismatch`: a terminal execution result. The compare-and-swap
        executed at `index` and its expectation did not match; it changed nothing and
        consumed the request ID (F-5). `current_version` is the key's version when the
        entry was applied, or null if the key was absent.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: version_mismatch
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [current_version, request_id, index, replayed]
              properties:
                current_version:
                  oneOf:
                    - $ref: '#/components/schemas/Version'
                    - type: 'null'
                request_id:
                  $ref: '#/components/schemas/RequestId'
                index:
                  $ref: '#/components/schemas/EntryIndex'
                replayed:
                  type: boolean
    RequestIdConflictError:
      description: >-
        `409 request_id_conflict`: a conflict refusal, terminal for this ID. The ID
        was first executed, with a different command, at `original_index`; nothing
        changed.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: request_id_conflict
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [request_id, original_index]
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
                original_index:
                  $ref: '#/components/schemas/EntryIndex'
    TooLargeError:
      description: >-
        `413 too_large`. `request_id` is present exactly when a well-formed
        `Idempotency-Key` was sent.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: too_large
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
    BusyWriteError:
      description: '`429 busy` on a write: a non-terminal refusal; this attempt was not submitted.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: busy
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [request_id, attempt_state]
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
                attempt_state:
                  const: not_submitted
    BusyReadError:
      description: '`429 busy` on a read or status lookup; it carries no write fields.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: busy
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
    UnavailableWriteError:
      description: >-
        `503 unavailable` on a write: no leader is known, or the node is shutting
        down. A non-terminal refusal; this attempt was not submitted.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: unavailable
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [request_id, attempt_state, nodes]
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
                attempt_state:
                  const: not_submitted
                nodes:
                  $ref: '#/components/schemas/NodeList'
    UnavailableReadError:
      description: '`503 unavailable` on a read or status lookup: the node is shutting down.'
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: unavailable
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [nodes]
              properties:
                nodes:
                  $ref: '#/components/schemas/NodeList'
    RecoveringWriteError:
      description: >-
        `503 recovering` on a write: the node is not ready. A non-terminal refusal;
        this attempt was not submitted.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: recovering
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [lifecycle, request_id, attempt_state]
              properties:
                lifecycle:
                  $ref: '#/components/schemas/NotReadyLifecycle'
                request_id:
                  $ref: '#/components/schemas/RequestId'
                attempt_state:
                  const: not_submitted
    RecoveringReadError:
      description: >-
        `503 recovering` on a read, status lookup or readiness probe: the node is not
        ready, so it serves no state at all, never an empty or partial one (A-2, §7.9).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: recovering
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [lifecycle]
              properties:
                lifecycle:
                  $ref: '#/components/schemas/NotReadyLifecycle'
    UnknownOutcomeError:
      description: >-
        `504 unknown_outcome`: unresolved. This attempt was submitted, so the write may
        or may not commit; it is never reported as failed (A-5).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: unknown_outcome
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [request_id, attempt_state, guidance, nodes]
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
                attempt_state:
                  const: submitted
                guidance:
                  const: retry_same_request_or_query_status
                nodes:
                  $ref: '#/components/schemas/NodeList'
    CapacityExceededError:
      description: >-
        `507 capacity_exceeded`: a terminal execution result. The write executed at
        `index` and the live-state quota (DM-6) refused it; it changed nothing and
        consumed the request ID. PUT and a matching compare-and-swap are checked
        identically; a mismatching compare-and-swap is `version_mismatch` instead.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: capacity_exceeded
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [request_id, limit, index, replayed]
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
                limit:
                  $ref: '#/components/schemas/LiveStateLimit'
                index:
                  $ref: '#/components/schemas/EntryIndex'
                replayed:
                  type: boolean
    HistoryFullError:
      description: >-
        `507 history_full`: a non-terminal refusal before proposal; this attempt was
        not submitted. Retrying helps only after the limit is raised (v2 compaction).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              const: history_full
            message:
              $ref: '#/components/schemas/ErrorMessage'
            details:
              type: object
              additionalProperties: false
              required: [request_id, limit, attempt_state]
              properties:
                request_id:
                  $ref: '#/components/schemas/RequestId'
                limit:
                  $ref: '#/components/schemas/HistoryLimit'
                attempt_state:
                  const: not_submitted
