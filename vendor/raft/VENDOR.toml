# Vendored raft-rs 0.7.0: the pinned Raft library (PLAN.md §7.3, D-05; W02.1).
#
# Area `vendor` (Appendix A). raft/ and raft-proto/ are the crates.io 0.7.0 sources,
# byte for byte, except the files listed under [[crate.modified]], [[crate.added]] and
# [[crate.omitted]]. [crate.files] records the sha256 of every vendored file. A change to
# any vendored file updates this manifest in the same commit. The tree ID covers everything
# here, generated code included.
#
# The determinism patch (W02.3, D-57) is applied: third_party/raft.patch takes the W02.1
# tree to this one, and build_id hashes it. It adds src/entropy.rs (the mandatory `Entropy`
# trait, and SplitMix64), makes Raft::new and RawNode::new take an `Entropy` source, routes
# the election-timeout reset through it, and removes the `rand` dependency. Vote,
# log-matching, quorum and commit rules are untouched. The [[crate.modified]] reasons below
# say which change touched each file.
#
# Consumers are engine crates only (DEP-RULE). They depend on vendor/raft/raft by path with
# default-features = false and the features below. The default `default-logger` feature
# (slog-envlogger, slog-term, slog-stdlog) reads the environment and writes to the
# terminal, so it is never enabled (§7.3: explicit logger).
#
# Code generation is pinned by vendoring its output ([codegen]); no protoc runs at build
# time, so no PATH-dependent protoc can vary the build (P4, T-3).

schema = "keyval.vendor.raft/v1"
# The project toolchain (rust-toolchain.toml) the vendored crates are built with.
toolchain = "1.99.0"

# Enabled features: raft with default-features = false; raft enables raft-proto's.
[features]
raft = ["protobuf-codec"]
raft-proto = ["protobuf-codec"]

[codegen]
crate = "raft-proto"
input = "proto/eraftpb.proto"
outputs = ["src/protos/mod.rs", "src/protos/eraftpb.rs"]
# raft-proto's unmodified build.rs (protobuf_build::Builder) ran protoc, then
# protobuf-codegen with the default Customize, then protobuf-build's enum-reading rewrite.
protoc = "libprotoc 3.9.0"
protoc_binary = "bin/protoc-linux-x86_64 bundled in protobuf-build 0.14.1"
protoc_sha256 = "30c6f9b5c03fb4ad7c2f0ad2efa0297c1f4e349726b6c968a029a277e864d48e"
protobuf_build = "0.14.1"
protobuf_build_crate_sha256 = "2df9942df2981178a930a72d442de47e2f0df18ad68e50a30f816f1848215ad0"
protobuf_codegen = "2.28.0"
protobuf_codegen_crate_sha256 = "033460afb75cf755fcfc16dfaed20b86468082a2ea24e05ac35ab4a099a017d6"
# Generated code works only with its generator's runtime; raft-proto pins it exactly.
protobuf_runtime = "2.28.0"
protobuf_runtime_crate_sha256 = "106dd99e98437432fed6519dedecfade6a06a73bb7b2a1e019fdd2bee5778d94"
regenerate = """
Outside this repository, with toolchain 1.99.0, build a scratch crate that depends on the
unmodified crates.io raft-proto 0.7.0 (default-features = false, features =
["protobuf-codec"]) with protobuf-build 0.14.1, protobuf-codegen 2.28.0 and protobuf
2.28.0 locked, and PROTOC set to protobuf-build's bundled bin/protoc-linux-x86_64. Copy
OUT_DIR/protos/mod.rs and OUT_DIR/protos/eraftpb.rs into raft-proto/src/protos/. They
must match [crate.files] byte for byte. OUT_DIR/protos/mod.desc is protoc's intermediate
descriptor set and is not vendored.
"""
# Two fresh build-script runs on 2026-10-03 produced identical bytes: one with PROTOC
# set, one with PROTOC unset and no protoc on PATH (protobuf-build's bundled fallback).
reproduced = "2026-10-03"

